<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Employee Attendance</title>

  <!-- Face API -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 20px;
    }

    .clock {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .camera-area {
      margin-bottom: 20px;
      position: relative;
    }

    video {
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      background: #000;
      transform: scaleX(-1);
      display: block;
      margin: 0 auto;
    }

    .camera-hint {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
      min-height: 20px;
    }

    .retry-camera {
      margin-top: 10px;
      background: #777;
      color: white;
      padding: 10px 16px;
      font-size: 14px;
      display: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 18px 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .time-in {
      background: #1d8f4e;
      color: white;
    }

    .time-out {
      background: #c62828;
      color: white;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #f1f3f5;
      min-height: 48px;
    }

    .success {
      color: #176b39;
      font-weight: bold;
    }

    .error {
      color: #b71c1c;
      font-weight: bold;
    }

    .loading {
      color: #555;
    }

    .employee-name {
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
    }

    .small {
      font-size: 13px;
      color: #888;
      margin-top: 15px;
    }

    @media (max-width: 500px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 25px 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Attendance</h1>

    <div class="subtitle">
      Employee Time In / Time Out
    </div>

    <div id="clock" class="clock">
      --:--:--
    </div>

    <div class="camera-area">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div id="cameraHint" class="camera-hint">
        Starting camera...
      </div>

      <button
        id="retryCameraBtn"
        class="retry-camera"
        onclick="autoStartCamera()">
        RETRY CAMERA
      </button>

    </div>

    <div class="buttons">

      <button
        id="timeInBtn"
        class="time-in"
        onclick="handleAction('TIME_IN')"
        disabled>
        TIME IN
      </button>

      <button
        id="timeOutBtn"
        class="time-out"
        onclick="handleAction('TIME_OUT')"
        disabled>
        TIME OUT
      </button>

    </div>

    <div id="employeeName"
         class="employee-name">
    </div>

    <div id="status"
         class="status">
      Loading attendance system...
    </div>

    <div class="small">
      Position your face in front of the camera, then press Time In or Time Out.
    </div>

  </div>

</div>


<script>

  /* =====================================================
     CONFIG - EDIT THIS AFTER YOU DEPLOY THE APPS SCRIPT
     =====================================================
     Paste your Apps Script Web App URL below. It looks like:
     https://script.google.com/macros/s/AKfycb.../exec

     Get it from: Apps Script editor > Deploy >
     Manage deployments > (copy the "Web app" URL).
  */
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw43E_E3cx2GznF_uQWsvuAi_mpt7v9kC74sFbfMBUDbH0FWcIaY0vxG8fmbCE8aepFtQ/exec';

  const MODEL_URL =
    'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';

  // Filled in from the server via getPublicConfig() once the
  // page loads, so this page and the backend can never drift
  // out of sync on the threshold.
  let FACE_MATCH_THRESHOLD = 0.48;

  // Re-pull the employee face list on this interval so a kiosk
  // left open all day picks up newly-registered employees
  // without needing a manual page refresh.
  const FACE_DB_REFRESH_MS = 5 * 60 * 1000; // 5 minutes

  let modelsLoaded = false;
  let faceDatabase = [];

  let cameraReady = false;
  let stream = null;
  let processing = false; // true while a scan/record is in flight


  /* =====================================================
     API HELPER
     =====================================================
     Sends a POST request to the Apps Script Web App as
     Content-Type: text/plain. This is intentional - it
     keeps the request a CORS "simple request" so the
     browser skips the OPTIONS preflight, which Apps Script
     cannot answer correctly. Apps Script still reads the
     raw JSON body fine via e.postData.contents.
  */
  function callApi(action, data) {

    const payload = Object.assign({ action: action }, data || {});

    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload)
    })
      .then(function(response) {

        if (!response.ok) {
          throw new Error('Network error (' + response.status + ').');
        }

        return response.json();
      });
  }


  /* =====================================================
     CLOCK
     ===================================================== */

  function updateClock() {

    const now = new Date();

    const formatter = new Intl.DateTimeFormat(
      'en-PH',
      {
        timeZone: 'Asia/Manila',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      }
    );

    document.getElementById('clock').textContent =
      formatter.format(now);
  }

  setInterval(updateClock, 1000);
  updateClock();


  /* =====================================================
     STATUS
     ===================================================== */

  function setStatus(message, type) {

    const el = document.getElementById('status');

    el.className = 'status';

    if (type) {
      el.classList.add(type);
    }

    el.textContent = message;
  }


  function setCameraHint(message) {
    document.getElementById('cameraHint').textContent = message || '';
  }


  /* =====================================================
     READY STATE
     =====================================================
     Buttons only enable once the camera is live, the models
     are loaded, and the employee face list has arrived.
  */
  function updateReadyState() {

    const ready =
      modelsLoaded &&
      cameraReady &&
      faceDatabase.length > 0 &&
      !processing;

    document.getElementById('timeInBtn').disabled = !ready;
    document.getElementById('timeOutBtn').disabled = !ready;

    if (processing) return;

    if (!cameraReady) {
      setStatus('Waiting for camera access...', 'loading');
      return;
    }

    if (!modelsLoaded) {
      setStatus('Loading face recognition...', 'loading');
      return;
    }

    if (!faceDatabase.length) {
      setStatus('No registered employees with face data were found.', 'error');
      return;
    }

    setStatus('Ready. Position your face and press Time In or Time Out.', 'success');
  }


  /* =====================================================
     LOAD PUBLIC CONFIG (threshold)
     ===================================================== */

  function loadPublicConfig() {

    return callApi('getPublicConfig')
      .then(function(config) {

        if (config && typeof config.faceMatchThreshold === 'number') {
          FACE_MATCH_THRESHOLD = config.faceMatchThreshold;
        }
      })
      .catch(function(error) {

        console.error(error);
        // Not fatal - fall back to the default above.
      });
  }


  /* =====================================================
     LOAD MODELS
     ===================================================== */

  async function loadModels() {

    try {

      await Promise.all([

        faceapi.nets.tinyFaceDetector.loadFromUri(
          MODEL_URL
        ),

        faceapi.nets.faceLandmark68Net.loadFromUri(
          MODEL_URL
        ),

        faceapi.nets.faceRecognitionNet.loadFromUri(
          MODEL_URL
        )

      ]);

      modelsLoaded = true;

    } catch (error) {

      console.error(error);

      setStatus(
        'Unable to load face recognition models.',
        'error'
      );

    } finally {

      updateReadyState();
    }
  }


  /* =====================================================
     LOAD EMPLOYEE FACE DATABASE
     ===================================================== */

  function loadFaceDatabase() {

    callApi('getPublicFaceDatabase')
      .then(function(data) {

        if (data && data.success === false) {
          throw new Error(data.message || 'Unable to load employee records.');
        }

        faceDatabase = data || [];

        console.log(
          'Employees loaded:',
          faceDatabase.length
        );
      })
      .catch(function(error) {

        console.error(error);

        if (!processing) {

          setStatus(
            error.message || 'Unable to load employee records.',
            'error'
          );
        }
      })
      .finally(function() {
        updateReadyState();
      });
  }


  /* =====================================================
     CAMERA - AUTO START
     =====================================================
     This page is a plain static file (hosted outside Apps
     Script's HtmlService iframe), so getUserMedia() is not
     blocked by Permissions-Policy the way it was before.
     The camera starts automatically on page load and stays
     live continuously - no "start camera" button needed.
  */

  async function autoStartCamera() {

    document.getElementById('retryCameraBtn').style.display = 'none';
    setCameraHint('Starting camera...');

    try {

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: {
            ideal: 640
          },
          height: {
            ideal: 480
          }
        },
        audio: false
      });

      const video =
        document.getElementById('video');

      video.srcObject = stream;

      await video.play();

      cameraReady = true;

      setCameraHint('');

    } catch (error) {

      console.error(error);

      cameraReady = false;

      setCameraHint(
        'Camera access was denied or unavailable.'
      );

      document.getElementById('retryCameraBtn').style.display =
        'inline-block';

    } finally {

      updateReadyState();
    }
  }


  /* =====================================================
     TIME IN / TIME OUT - scan + record in one press
     ===================================================== */

  async function handleAction(action) {

    if (processing) return;

    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {

      setStatus(
        'This page is not configured yet - set APPS_SCRIPT_URL in the code.',
        'error'
      );

      return;
    }

    if (!cameraReady || !modelsLoaded || !faceDatabase.length) {
      updateReadyState();
      return;
    }

    processing = true;
    updateReadyState();

    setStatus('Scanning face...', 'loading');

    try {

      const video =
        document.getElementById('video');

      const detection =
        await faceapi
          .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 416,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks()
          .withFaceDescriptor();

      if (!detection) {

        setStatus(
          'No face detected. Please look directly at the camera and try again.',
          'error'
        );

        processing = false;
        updateReadyState();

        return;
      }

      const descriptor =
        Array.from(detection.descriptor);

      const match =
        findBestMatch(descriptor);

      if (!match) {

        setStatus(
          'Face not recognized. Please try again.',
          'error'
        );

        processing = false;
        updateReadyState();

        return;
      }

      const employee =
        match.employee;

      document.getElementById(
        'employeeName'
      ).textContent =
        employee.fullName;

      setStatus(
        'Identity verified. Recording attendance...',
        'loading'
      );

      const result = await callApi('recordAttendance', {
        employeeId: employee.employeeId,
        attendanceAction: action
      });

      handleAttendanceResult(result);

    } catch (error) {

      console.error(error);

      setStatus(
        error.message || 'An error occurred during face recognition.',
        'error'
      );

      processing = false;
      updateReadyState();
    }
  }


  /* =====================================================
     FACE MATCHING
     ===================================================== */

  function findBestMatch(queryDescriptor) {

    let bestEmployee = null;
    let bestDistance = Infinity;

    for (const employee of faceDatabase) {

      if (
        !employee.descriptor ||
        employee.descriptor.length !== 128
      ) {
        continue;
      }

      const distance =
        euclideanDistance(
          queryDescriptor,
          employee.descriptor
        );

      if (distance < bestDistance) {

        bestDistance = distance;
        bestEmployee = employee;
      }
    }

    if (
      bestEmployee &&
      bestDistance <= FACE_MATCH_THRESHOLD
    ) {

      return {
        employee: bestEmployee,
        distance: bestDistance
      };
    }

    return null;
  }


  function euclideanDistance(a, b) {

    let sum = 0;

    for (let i = 0; i < a.length; i++) {

      const difference =
        a[i] - b[i];

      sum += difference * difference;
    }

    return Math.sqrt(sum);
  }


  /* =====================================================
     ATTENDANCE RESULT
     =====================================================
     recordAttendance always returns normally (never throws)
     even when the business action fails (e.g. already timed
     in), so success:false here means "show this message",
     not "something broke".
  */
  function handleAttendanceResult(result) {

    if (!result) {

      setStatus(
        'No response received from server.',
        'error'
      );

    } else if (!result.success) {

      setStatus(
        result.message,
        'error'
      );

    } else {

      const actionText =
        result.type === 'TIME_IN'
          ? 'Time In'
          : 'Time Out';

      setStatus(
        actionText +
        ' recorded successfully at ' +
        result.time,
        'success'
      );

      document.getElementById(
        'employeeName'
      ).textContent =
        result.fullName;
    }

    // Brief cooldown so the same face can't double-tap the
    // action, and so the next person has a clean slate.
    setTimeout(function() {

      document.getElementById(
        'employeeName'
      ).textContent = '';

      processing = false;
      updateReadyState();

    }, 3000);
  }


  /* =====================================================
     INITIALIZE
     ===================================================== */

  window.addEventListener(
    'load',
    async function() {

      updateReadyState();

      autoStartCamera();

      await loadPublicConfig();
      await loadModels();

      loadFaceDatabase();

      setInterval(
        loadFaceDatabase,
        FACE_DB_REFRESH_MS
      );

    }
  );

</script>

</body>
</html>
